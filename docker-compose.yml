services:
  db:
    image: postgres:16-alpine
    container_name: momentscape-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: momentscape-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: ${API_PORT:-5000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://momentscape:momentscape_password@db:5432/momentscape_dev}
    volumes:
      - ./backend/src:/app/backend/src
      - ./packages:/app/packages
      - /app/node_modules
      - /app/backend/node_modules
      - /app/packages/database/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: momentscape-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://momentscape:momentscape_password@db:5432/momentscape_dev}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-do-not-use-in-production-change-me}
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./packages:/app/packages
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/packages/database/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
