version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: momentscape-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: momentscape-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV}
      API_PORT: ${API_PORT}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./backend/src:/app/backend/src
      - ./packages:/app/packages
      - /app/node_modules
      - /app/backend/node_modules
      - /app/packages/database/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "cd packages/database && npx prisma generate && npx prisma migrate deploy && cd /app/backend && npm run dev"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: momentscape-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./packages:/app/packages
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/packages/database/node_modules
    depends_on:
      - backend
    command: sh -c "cd packages/database && npx prisma generate && cd /app/frontend && npm run dev"

volumes:
  postgres_data:
